<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SKYHUNT Worker Test</title>
<style>body{max-width:850px;margin:40px auto;padding:0 18px;background:#071018;color:#eef7fb;font:16px system-ui}button{padding:14px 18px;border:0;border-radius:12px;background:#a9e7f4;font-weight:800}pre{white-space:pre-wrap;word-break:break-word;background:#0d1821;border:1px solid #20323f;border-radius:14px;padding:18px;min-height:180px}a{color:#a9e7f4}</style></head>
<body><a href="index.html">&larr; SKYHUNT</a><h1>Cloudflare bridge test</h1><p>Runs health, Heathrow point, validation, and CORS-visible response tests against the deployed Worker.</p><button id="run">RUN TESTS</button><pre id="out">Ready.</pre>
<script>
const BASE="https://skyhunt-api.danjohnson179.workers.dev",out=document.querySelector("#out");
async function test(name,path){const started=performance.now();try{const r=await fetch(BASE+path,{cache:"no-store",headers:{Accept:"application/json"}}),text=await r.text();let data;try{data=JSON.parse(text)}catch{}return`[${r.ok?"PASS":"FAIL"}] ${name} — HTTP ${r.status} — ${Math.round(performance.now()-started)} ms\nProvider: ${data?._skyhunt?.provider||"n/a"}\nCache: ${r.headers.get("x-skyhunt-cache")||"n/a"}\n${text.slice(0,800)}`}catch(e){return`[FAIL] ${name}\n${e.name}: ${e.message}`}}
document.querySelector("#run").onclick=async e=>{e.target.disabled=true;out.textContent="Testing…";const results=[];results.push(await test("Health","/health"));results.push(await test("Point","/point?lat=51.4700&lon=-0.4543&radius=100"));results.push(await test("Validation (HTTP 400 expected)","/point?lat=999&lon=0&radius=100"));out.textContent=results.join("\n\n");e.target.disabled=false};
</script></body></html>
